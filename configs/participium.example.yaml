execution:
  runner: python_requests
  timeout_seconds: 30

budget:
  max_iterations: 3
  # Raised from 10, which was a scarcity setting from the 8 GB era and left two thirds of
  # each project's implemented requirements with no test at all: 10 items per project
  # covered 6.8 of 18.6 implemented requirements, 37%.
  max_tests_per_iteration: 30
  max_llm_calls: 50

output:
  runs_dir: data/runs
