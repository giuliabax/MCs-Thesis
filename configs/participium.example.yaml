project_name: participium-thesis-run
run_id: null

llm:
  provider: lmstudio
  model: ${LMSTUDIO_MODEL}
  temperature: 0.1
  # Ceiling on output (reasoning + content), not a target: the model stops on its own.
  # Two limits bound it, and both apply to the 1.5x retry in LMStudioLLMClient, not just
  # to this value: the loaded context window minus the prompt, and timeout_seconds times
  # the measured generation rate.
  max_tokens: 20000
  base_url: ${LMSTUDIO_BASE_URL}
  # timeout_seconds: 1200
  # Only the matcher reasons; the planner emits JSON directly (faster, and measured
  # more accurate on 8 GB, where reasoning competed with the prompt for a 16k window).
  # Worth re-measuring on a larger window: add test_strategy_planner here to A/B it.
  reasoning_agents: [requirement_api_matcher]
  # Plan in batches of requirements. Required at this budget, not optional: measured on
  # team16, a single call asked to produce 30 strategy items generated ~35k tokens of
  # JSON without ever closing it, exhausting the token ceiling twice. Batching keeps each
  # response small, and with each batch receiving its own share of the budget it filled
  # 30 items covering 29 of 29 requirements in 181s.
  batch_strategy_planner: true
  overrides:
    # The matcher is the reasoning agent, so max_tokens is its deliberation budget and
    # not just a length cap. Raising it to 20000 made it markedly more literal: on
    # team16 it stopped granting inferential matches and returned 7 not_assessable
    # where 9000 returns none, costing recall. Keep it at the value the July baseline
    # used; the planner keeps the larger budget it needs to emit a whole strategy in
    # one call.
    requirement_api_matcher:
      max_tokens: 9000
  # An override may also reroute one agent to another provider (needs a paid Groq tier
  # — the free tier caps at 8000 tokens/minute). Not required: compact payloads keep
  # every agent within the local context window.
  #   test_strategy_planner:
  #     provider: groq
  #     model: your-groq-model-id

