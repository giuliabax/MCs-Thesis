# participium-team05: the Docker secrets its own compose file never declares.
#
# server/src/config/index.ts reads every setting from /run/secrets/<NAME> and throws on
# the first one it cannot open, so the application dies before it ever listens:
#
#   ENOENT: open '/run/secrets/APP_PORT'
#
# Its Docker/docker-compose.prod.yaml has no `secrets:` section at all, top level or per
# service, so the stack as delivered could not have started. Environment variables are no
# substitute: the code calls fs.readFileSync on the path, never process.env.
#
# The values are ours, and the reasoning in data/sut_env/README.md applies unchanged --
# database credentials are free choices, the JWT secret is a throwaway for a container
# that lives minutes on a loopback port, and the mail and Cloudinary settings are
# deliberately unreachable because no such service exists here.
#
# The `file:` paths climb three levels, not two. Compose resolves relative paths against
# the project directory, which defaults to the directory of the FIRST -f file -- here
# projects/participium-team05/Docker -- and not against the file that declares them.

services:
  server:
    secrets:
      - APP_PORT
      - CLOUDINARY_API_KEY
      - CLOUDINARY_API_SECRET
      - CLOUDINARY_CLOUD_NAME
      - CLOUDINARY_DEFAULT_FOLDER
      - CLOUDINARY_UPLOAD_PRESET
      - COMBINED_LOG_FILE
      - DB_HOST
      - DB_NAME
      - DB_PASSWORD
      - DB_PORT
      - DB_TYPE
      - DB_USERNAME
      - ERROR_LOG_FILE
      - JWT_SECRET
      - LOG_LEVEL
      - LOG_PATH
      - MAIL_FROM_ADDRESS
      - MAIL_FROM_NAME
      - SMTP_HOST
      - SMTP_PASS
      - SMTP_PORT
      - SMTP_USER
      - TELEGRAM_BOT_API_TOKEN

secrets:
  APP_PORT:
    file: ../../../data/sut_secrets/team05/APP_PORT
  CLOUDINARY_API_KEY:
    file: ../../../data/sut_secrets/team05/CLOUDINARY_API_KEY
  CLOUDINARY_API_SECRET:
    file: ../../../data/sut_secrets/team05/CLOUDINARY_API_SECRET
  CLOUDINARY_CLOUD_NAME:
    file: ../../../data/sut_secrets/team05/CLOUDINARY_CLOUD_NAME
  CLOUDINARY_DEFAULT_FOLDER:
    file: ../../../data/sut_secrets/team05/CLOUDINARY_DEFAULT_FOLDER
  CLOUDINARY_UPLOAD_PRESET:
    file: ../../../data/sut_secrets/team05/CLOUDINARY_UPLOAD_PRESET
  COMBINED_LOG_FILE:
    file: ../../../data/sut_secrets/team05/COMBINED_LOG_FILE
  DB_HOST:
    file: ../../../data/sut_secrets/team05/DB_HOST
  DB_NAME:
    file: ../../../data/sut_secrets/team05/DB_NAME
  DB_PASSWORD:
    file: ../../../data/sut_secrets/team05/DB_PASSWORD
  DB_PORT:
    file: ../../../data/sut_secrets/team05/DB_PORT
  DB_TYPE:
    file: ../../../data/sut_secrets/team05/DB_TYPE
  DB_USERNAME:
