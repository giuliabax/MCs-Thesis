# participium-team12: the one variable that stops its API from booting.
#
# The NestJS container crash-looped on
#
#   ERROR [ExceptionHandler] Error: TELEGRAM_BOT_TOKEN is not defined in environment
#   variables
#
# Its compose file supplies a default for every other setting -- ${POSTGRES_USER:-admin},
# ${MINIO_ROOT_USER:-minioadmin} and so on -- and this one alone has none, because a bot
# token is a credential and correctly was not committed.
#
# The token here is a placeholder. Whether that is enough depends on what the application
# does with it: team12 only checks that it is defined, while team06 hands its token to a
# library that calls Telegram's getMe at startup and dies on the 401 that comes back. A
# placeholder cannot help in that case, which is why team06 is recorded as unrunnable and
# this one is not.

services:
  api:
    environment:
      TELEGRAM_BOT_TOKEN: "000000:thesis-placeholder-token"
      EMAIL_HOST: mail.example.invalid
